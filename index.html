<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crianza Positiva 8°A · Explicada para Isaac</title>
<meta name="description" content="Taller de crianza positiva en el marco de la Ley de Infancia y Adolescencia. Reunión del grado 8°A, viernes 6 de noviembre de 2026, 6:00 a. m.">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Crianza Positiva 8°A · Explicada para Isaac">
<meta property="og:description" content="Lo que dice la Ley 1098 de 2006 y la Ley 2089 de 2021, explicado en familia. Reunión: viernes 6 de noviembre, 6:00 a. m.">
<meta property="og:image" content="https://images.unsplash.com/photo-1531984929664-2fb2be468d3e?fm=jpg&q=75&w=1200&h=630&fit=crop">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://crianza-positiva-8a.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://images.unsplash.com/photo-1531984929664-2fb2be468d3e?fm=jpg&q=75&w=1200&h=630&fit=crop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3a5f; --navy2:#14273f; --coral:#e8735a; --peach:#fbe9df; --cream:#fdf8f3;
  --sage:#6f9a7a; --gold:#f2b84b; --ink:#1b2430; --muted:#5d6878; --card:#ffffff;
  --r:18px; --shadow:0 10px 30px rgba(20,39,63,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Nunito Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* barra */
.bar{position:sticky;top:0;z-index:50;background:rgba(20,39,63,.92);backdrop-filter:blur(10px);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--gold)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#dfe7f2;text-decoration:none;font-size:.85rem;font-weight:700;padding:7px 11px;border-radius:30px;white-space:nowrap;transition:.2s}
.nav a:hover,.nav a.on{background:rgba(255,255,255,.14);color:#fff}
.btns{display:flex;gap:6px}
.pill{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:30px;padding:5px 11px;font-size:.8rem;font-weight:800}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--navy2)}

/* hero */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.slides,.slides div{position:absolute;inset:0}
.slides div{background-size:cover;background-position:center;opacity:0;transform:scale(1.08);transition:opacity 1.6s ease,transform 7s ease}
.slides div.on{opacity:1;transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,39,63,.15) 0%,rgba(20,39,63,.55) 45%,rgba(20,39,63,.95) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:56px;padding-top:120px}
.tag{display:inline-block;background:var(--coral);color:#fff;font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:30px;margin-bottom:16px}
.hero h1{font-size:clamp(2.1rem,6vw,4rem);max-width:820px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:clamp(1rem,2.2vw,1.25rem);max-width:640px;margin:16px 0 26px;color:#e8eef6}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:14px;padding:10px 14px;min-width:78px;text-align:center}
.count b{display:block;font-family:Fraunces,serif;font-size:1.9rem}
.count small{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#cfdbe9}
.countnote{margin-top:12px;font-weight:700;color:var(--gold)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;border:none;border-radius:40px;padding:13px 22px;font-weight:800;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.main{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(232,115,90,.4)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn.dark{background:var(--navy);color:#fff}

/* hoy */
.today{background:var(--navy);color:#fff}
.today .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 20px}
.today .lbl{font-family:Fraunces,serif;font-size:1.3rem;color:var(--gold)}
.today p{font-size:.98rem}
.today button{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:30px;padding:8px 14px;font-weight:800;font-size:.85rem}

section{padding:80px 0}
.kicker{color:var(--coral);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:8px 0 14px;color:var(--navy2)}
.intro{color:var(--muted);max-width:720px;font-size:1.05rem;margin-bottom:34px}

/* reunión */
.meet{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:stretch}
.meet .photo{border-radius:var(--r);background-size:cover;background-position:center;min-height:340px;box-shadow:var(--shadow)}
.meet .info{background:var(--card);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed #e4dcd3}
.row:last-child{border:none}
.row b{min-width:96px;color:var(--navy)}
.topic{background:var(--peach);border-left:5px solid var(--coral);border-radius:10px;padding:12px 14px;margin-top:10px;font-weight:600}

/* pilares */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.pcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .35s}
.pcard:hover{transform:translateY(-6px)}
.pcard .img{height:170px;background-size:cover;background-position:center;position:relative}
.pcard .num{position:absolute;left:14px;bottom:-18px;width:44px;height:44px;border-radius:50%;background:var(--coral);color:#fff;font-family:Fraunces,serif;font-weight:800;font-size:1.3rem;display:grid;place-items:center;border:3px solid #fff}
.pcard .tx{padding:28px 20px 22px}
.pcard h3{font-size:1.2rem;color:var(--navy2);margin-bottom:6px}
.pcard p{color:var(--muted);font-size:.95rem}
.pcard .try{margin-top:10px;font-size:.88rem;background:#eef4ef;color:#365a40;border-radius:10px;padding:9px 11px;font-weight:600}

/* ley */
.lawsec{background:linear-gradient(180deg,#fff 0%,var(--peach) 100%)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:30px;padding:9px 16px;font-weight:800;font-size:.9rem;transition:.2s}
.tab.on{background:var(--navy);color:#fff}
.laws{display:grid;gap:14px}
.art{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(20,39,63,.08);overflow:hidden}
.art summary{list-style:none;padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;font-weight:800;color:var(--navy2)}
.art summary::-webkit-details-marker{display:none}
.art summary .n{background:var(--navy);color:#fff;border-radius:10px;padding:4px 10px;font-size:.8rem;white-space:nowrap}
.art summary .plus{margin-left:auto;font-size:1.4rem;color:var(--coral);transition:transform .3s}
.art[open] summary .plus{transform:rotate(45deg)}
.art .body{padding:0 20px 20px 20px;color:#334}
.art .body p+p{margin-top:8px}
.art .isaac{margin-top:12px;background:#fff7e6;border-left:5px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:.95rem}
.art .isaac b{color:#8a5a00}
.src{font-size:.82rem;color:var(--muted);margin-top:18px}
.src a{color:var(--navy)}

/* derechos deberes */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dcol{border-radius:var(--r);padding:26px;color:#fff;position:relative;overflow:hidden}
.dcol.r{background:linear-gradient(135deg,#1f3a5f,#2d5687)}
.dcol.d{background:linear-gradient(135deg,#b9553f,#e8735a)}
.dcol h3{font-size:1.5rem;margin-bottom:14px}
.dcol li{list-style:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.2);opacity:0;transform:translateX(-12px);transition:.5s}
.dcol.show li{opacity:1;transform:none}
.dcol li:last-child{border:none}

/* escenarios */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.flip{perspective:1200px;height:320px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:auto}
.face.f{background-size:cover;background-position:center;color:#fff;justify-content:flex-end}
.face.f::before{content:"";position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(20,39,63,.92))}
.face.f *{position:relative}
.face.f h3{font-size:1.3rem}
.face.f small{color:var(--gold);font-weight:800;margin-top:6px}
.face.b{background:#fff;transform:rotateY(180deg)}
.no,.yes{border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:8px}
.no{background:#fdecea;color:#8b2c1d}
.yes{background:#e9f3ec;color:#24533a}
.no b,.yes b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}

/* quiz */
.quizsec{background:var(--navy2);color:#fff}
.quizsec h2{color:#fff}
.quizsec .intro{color:#c7d3e3}
.qbox{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:var(--r);padding:28px;max-width:760px}
.prog{height:8px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.qq{font-family:Fraunces,serif;font-size:1.35rem;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:13px 16px;margin:8px 0;transition:.2s}
.opt:hover{background:rgba(255,255,255,.15)}
.opt.ok{background:#2f7a4f;border-color:#2f7a4f}
.opt.bad{background:#a6402c;border-color:#a6402c}
.expl{margin-top:14px;background:rgba(242,184,75,.15);border-left:4px solid var(--gold);padding:12px;border-radius:8px;display:none}
.qnav{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.score{font-family:Fraunces,serif;font-size:3rem;color:var(--gold)}

/* pacto */
.pact{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.plist label{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(20,39,63,.06);cursor:pointer;transition:.2s}
.plist label:hover{transform:translateX(4px)}
.plist input{width:20px;height:20px;accent-color:var(--coral);margin-top:2px;flex-shrink:0}
.plist h3{font-size:1.15rem;color:var(--navy);margin:6px 0 10px}
.meter{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--shadow);text-align:center;position:sticky;top:80px;align-self:start}
.ring{width:170px;height:170px;margin:10px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--coral) 0deg,#eee 0deg);transition:background .5s}
.ring span{width:132px;height:132px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:2.2rem;color:var(--navy2)}
textarea{width:100%;border:1.5px solid #e0d6cc;border-radius:12px;padding:12px;font:inherit;min-height:90px;margin:10px 0}

/* preguntas */
.asks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.ask{background:#fff;border-radius:14px;padding:20px;border-top:5px solid var(--sage);box-shadow:0 4px 14px rgba(20,39,63,.07)}
.ask b{color:var(--sage);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.ask p{margin-top:6px;font-weight:600}

/* ayuda */
.help{background:linear-gradient(135deg,var(--navy),#2b4f7c);color:#fff;border-radius:24px;padding:34px;display:grid;grid-template-columns:1.2fr 1fr;gap:26px;overflow:hidden;position:relative}
.help h2{color:#fff}
.help .lines{display:grid;gap:12px}
.line{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:#fff;transition:.2s}
.line:hover{background:rgba(255,255,255,.2)}
.line b{font-family:Fraunces,serif;font-size:1.6rem;color:var(--gold)}
.help .photo{border-radius:18px;background-size:cover;background-position:center;min-height:260px}

footer{background:var(--navy2);color:#b9c6d8;padding:34px 0;font-size:.9rem;margin-top:80px}
footer b{color:#fff}
footer a{color:var(--gold)}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.reveal.show{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:30px;font-weight:700;z-index:99;transition:.4s}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .meet,.dd,.pact,.help{grid-template-columns:1fr}
  .meter{position:static}
  .today .wrap{grid-template-columns:1fr}
  .brand{display:none}
  section{padding:60px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand">Crianza <span>Positiva</span> 8°A</div>
    <nav class="nav" id="nav"></nav>
    <div class="btns">
      <button class="pill on" data-lang="es">ES</button>
      <button class="pill" data-lang="en">EN</button>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <div class="slides" id="slides"></div>
  <div class="wrap">
    <span class="tag" data-t="heroTag"></span>
    <h1 data-t="heroTitle"></h1>
    <p class="lead" data-t="heroLead"></p>
    <div class="count" id="count"></div>
    <div class="countnote" id="countnote"></div>
    <div class="cta">
      <a class="btn main" href="#pilares" data-t="ctaStart"></a>
      <a class="btn ghost" href="#quiz" data-t="ctaQuiz"></a>

  </div>
</div>

<div class="today">
  <div class="wrap">
    <div class="lbl" data-t="todayLbl"></div>
    <p id="todayTx"></p>
    <button id="todayBtn" data-t="todayBtn"></button>
  </div>
</div>

<section id="reunion">
  <div class="wrap">
    <div class="kicker reveal" data-t="k1"></div>
    <h2 class="reveal" data-t="h1"></h2>
    <p class="intro reveal" data-t="i1"></p>
    <div class="meet">
      <div class="photo reveal" style="background-image:url('https://images.unsplash.com/photo-1758525860435-502240649c59?fm=jpg&q=70&w=1200&auto=format&fit=crop')"></div>
      <div class="info reveal" id="meetInfo"></div>
    </div>
  </div>
</section>

<section id="pilares" style="padding-top:0">
  <div class="wrap">
    <div class="kicker reveal" data-t="k2"></div>
    <h2 class="reveal" data-t="h2"></h2>
    <p class="intro reveal" data-t="i2"></p>
    <div class="pillars" id="pillars"></div>
  </div>
</section>

<section id="ley" class="lawsec">
  <div class="wrap">
    <div class="kicker reveal" data-t="k3"></div>
    <h2 class="reveal" data-t="h3"></h2>
    <p class="intro reveal" data-t="i3"></p>
    <div class="tabs" id="tabs"></div>
    <div class="laws" id="laws"></div>
    <p class="src" data-t="src"></p>
  </div>
</section>

<section id="derechos">
  <div class="wrap">
    <div class="kicker reveal" data-t="k4"></div>
    <h2 class="reveal" data-t="h4"></h2>
    <p class="intro reveal" data-t="i4"></p>
    <div class="dd">
      <div class="dcol r" id="colR"></div>
      <div class="dcol d" id="colD"></div>
    </div>
  </div>
</section>

<section id="situaciones" style="padding-top:0">
  <div class="wrap">
    <div class="kicker reveal" data-t="k5"></div>
    <h2 class="reveal" data-t="h5"></h2>
    <p class="intro reveal" data-t="i5"></p>
    <div class="scen" id="scen"></div>
  </div>
</section>

<section id="quiz" class="quizsec">
  <div class="wrap">
    <div class="kicker" data-t="k6"></div>
    <h2 data-t="h6"></h2>
    <p class="intro" data-t="i6"></p>
    <div class="qbox" id="qbox"></div>
  </div>
</section>

<section id="pacto">
  <div class="wrap">
    <div class="kicker reveal" data-t="k7"></div>
    <h2 class="reveal" data-t="h7"></h2>
    <p class="intro reveal" data-t="i7"></p>
    <div class="pact">
      <div class="plist" id="plist"></div>
      <div class="meter">
        <h3 data-t="meterT"></h3>
        <div class="ring" id="ring"><span id="ringN">0%</span></div>
        <p id="meterMsg" style="color:var(--muted)"></p>
        <textarea id="note"></textarea>
        <button class="btn main" id="shareP" data-t="shareP"></button>
      </div>
    </div>
  </div>
</section>

<section id="preguntas" style="padding-top:0">
  <div class="wrap">
    <div class="kicker reveal" data-t="k8"></div>
    <h2 class="reveal" data-t="h8"></h2>
    <p class="intro reveal" data-t="i8"></p>
    <div class="asks" id="asks"></div>
  </div>
</section>

<section id="ayuda" style="padding-top:0">
  <div class="wrap">
    <div class="help reveal">
      <div>
        <div class="kicker" style="color:var(--gold)" data-t="k9"></div>
        <h2 data-t="h9"></h2>
        <p style="color:#d5e0ee;margin-bottom:18px" data-t="i9"></p>
        <div class="lines" id="lines"></div>
      </div>
      <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1475609471617-0ef53b59cff5?fm=jpg&q=70&w=900&auto=format&fit=crop')"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p><b>Crianza Positiva 8°A · Explicada para Isaac</b> — <span data-t="foot1"></span></p>
    <p style="margin-top:8px" data-t="foot2"></p>
    <p style="margin-top:8px"><span data-t="foot3"></span> <b>Vibras Positivas HM</b> · Caucasia, Antioquia · <a href="https://vibraspositivashm.com">vibraspositivashm.com</a></p>
    <p style="margin-top:8px;font-size:.8rem" id="clock"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const MEETING = new Date("2026-11-06T06:00:00-05:00");
const U = id => `https://images.unsplash.com/${id}?fm=jpg&q=70&w=1400&auto=format&fit=crop`;
const SLIDES = ["photo-1531984929664-2fb2be468d3e","photo-1792587716357-32a29eca7629","photo-1557176278-3326a3193580","photo-1629360046014-c8c91b6c2881"];

const T = {
es:{
 nav:[["reunion","La reunión"],["pilares","Crianza positiva"],["ley","La ley"],["derechos","Derechos y deberes"],["situaciones","Situaciones"],["quiz","Quiz"],["pacto","Pacto familiar"],["ayuda","Ayuda"]],
 heroTag:"Grado 8°A · Taller para la familia",
 heroTitle:"Crianza <em>positiva</em>, explicada para Isaac",
 heroLead:"Lo que vamos a hablar en la reunión del viernes: cómo educar con amor y con límites, y lo que dice la Ley de Infancia y Adolescencia de Colombia sobre el buen trato.",

 topicsT:"Temas a tratar",
 topics:["Seguimiento académico y de convivencia del grupo.","Taller de crianza positiva, en el marco de la Ley de Infancia y Adolescencia."],
 meetNote:"Su asistencia es muy importante.",
 k2:"Qué es", h2:"Los 5 pilares de la crianza positiva",
 i2:"Crianza positiva no es dejar hacer lo que uno quiera. Es educar con cariño y con reglas claras, sin golpes, sin gritos y sin humillar. La idea es que el hijo aprenda por qué algo está bien o mal, no que obedezca solo por miedo.",
 pillars:[
  ["Afecto que se nota","Decir y mostrar que lo queremos, también cuando se equivoca. El cariño no se gana con notas: se da siempre.","Prueba hoy: un abrazo y un «estoy orgulloso de ti» por algo pequeño.","photo-1531984929664-2fb2be468d3e"],
  ["Escuchar de verdad","Preguntar cómo le fue, mirarlo a los ojos y dejar el celular a un lado. Escuchar antes de corregir.","Prueba hoy: 10 minutos de charla sin pantallas en la comida.","photo-1629360046014-c8c91b6c2881"],
  ["Límites claros y con respeto","Las reglas se explican, se acuerdan y se cumplen. Si se rompen, hay una consecuencia justa, no un castigo que duela.","Prueba hoy: escriban juntos tres reglas de la casa.","photo-1758525860435-502240649c59"],
  ["Dar ejemplo","Los hijos copian lo que ven. Si queremos respeto, calma y responsabilidad, tenemos que mostrarlos primero.","Prueba hoy: si te equivocas, pide perdón delante de él.","photo-1557176278-3326a3193580"],
  ["Autonomía y responsabilidad","A los 13 o 14 años ya puede tomar decisiones pequeñas y responder por ellas: tareas, horarios, su cuarto.","Prueba hoy: déjalo organizar su propio horario de estudio.","photo-1792587716357-32a29eca7629"]
 ],
 k3:"La ley", h3:"Lo que dice la ley en Colombia",
 i3:"El taller es «en el marco de la Ley de Infancia y Adolescencia». Aquí están los artículos clave, con una explicación sencilla para Isaac. Toca cada uno para abrirlo.",
 tabs:["Ley 1098 de 2006","Ley 2089 de 2021","Ley 1620 de 2013"],
 laws:[
  [
   ["Art. 14","La responsabilidad parental","Es la obligación de los padres de orientar, cuidar, acompañar y criar a los hijos durante su formación. La ley dice que en ningún caso esa responsabilidad puede ir con violencia física o psicológica.","Tus papás tienen el deber de guiarte, y la ley les dice que lo hagan sin violencia."],
   ["Art. 15","Derechos con responsabilidades","Los niños y adolescentes también tienen responsabilidades, de acuerdo con su edad. Ejercer los derechos implica cumplir obligaciones en la familia, el colegio y la sociedad.","Tener derechos no es solo pedir: también te toca cumplir con tu parte."],
   ["Art. 18","Derecho a la integridad personal","Los niños, niñas y adolescentes tienen derecho a ser protegidos contra el maltrato y los abusos de toda índole, por parte de sus padres, de quienes los cuidan, de sus parientes y de cualquier persona.","Nadie puede maltratarte, ni en la casa ni en el colegio ni en la calle."],
   ["Art. 18-A","Derecho al buen trato","Lo agregó la Ley 2089 de 2021. Los niños y adolescentes tienen derecho a recibir orientación, educación, cuidado y disciplina por métodos no violentos, protegiendo su integridad física, psíquica y emocional.","Te pueden corregir, claro, pero hablando, poniendo límites y con consecuencias justas, nunca con golpes ni humillaciones."],
   ["Art. 39","Obligaciones de la familia","La familia debe promover la igualdad de derechos, el afecto, la solidaridad y el respeto entre todos sus integrantes. También debe asegurar la educación, la salud y el desarrollo de los hijos, y formarlos en valores.","En la casa todos se deben respeto: papás a hijos y también hijos a papás."],
   ["Art. 42 y 43","Obligaciones del colegio","Las instituciones educativas deben garantizar un trato respetuoso y digno, formar en el respeto y la convivencia, y proteger a los estudiantes contra toda forma de maltrato, agresión física o psicológica y humillación.","El colegio también tiene que cuidarte y enseñar a convivir. Por eso hace este taller."]
  ],
  [
   ["Art. 1","Prohíbe el castigo físico","Colombia prohíbe el uso del castigo físico y de los tratos crueles, humillantes o degradantes como método de corrección contra niñas, niños y adolescentes.","Ya no es legal pegarle a un hijo para «educarlo»."],
   ["Art. 2","Qué es castigo físico y qué es trato humillante","Castigo físico es usar la fuerza para causar dolor como forma de corrección. Trato cruel o humillante es lo que menosprecia, degrada, ridiculiza o amenaza la dignidad del niño: insultos, burlas, amenazas.","No solo los golpes hacen daño: los gritos, los insultos y las burlas también."],
   ["Art. 5","Estrategia Nacional Pedagógica","El ICBF lidera una estrategia para enseñar a las familias alternativas para educar, orientar y disciplinar sin violencia. Los municipios la deben adoptar y los colegios participan.","Talleres como el del viernes salen de esta ley."]
  ],
  [
   ["Ley 1620","Sistema Nacional de Convivencia Escolar","Crea el sistema de convivencia escolar, los comités de convivencia en los colegios y la Ruta de Atención Integral para casos de acoso, violencia o conflictos entre estudiantes.","Si hay matoneo o problemas de convivencia, el colegio tiene una ruta para atenderlos."],
   ["Participación","La familia hace parte","La ley pide a las familias acompañar el proceso educativo, conocer el manual de convivencia y asistir a las reuniones y talleres que programe el colegio.","Por eso es importante que tu papá o tu mamá vayan a la reunión."]
  ]
 ],
 lawIsaac:"Para Isaac:",
 src:"Fuentes: Ley 1098 de 2006 (Código de la Infancia y la Adolescencia), Ley 2089 de 2021 y Ley 1620 de 2013, consultadas en <a href='https://www.icbf.gov.co/cargues/avance/compilacion/docs/ley_2089_2021.htm' target='_blank' rel='noopener'>ICBF</a> y <a href='https://www.suin-juriscol.gov.co' target='_blank' rel='noopener'>SUIN-Juriscol</a>. Los textos están resumidos en palabras sencillas; para el texto oficial, consulte las fuentes.",

 i4:"Los derechos y los deberes van juntos. Esto es lo que te toca recibir y lo que te toca dar.",
 rT:"Tengo derecho a…",
 r:["Que me traten con respeto, sin golpes, sin gritos y sin humillaciones.","Que me escuchen y que mi opinión se tenga en cuenta.","Estudiar y que me acompañen en el colegio.","Equivocarme y aprender de mis errores.","Que me protejan de cualquier maltrato o abuso.","Descansar, jugar y tener amigos."],
 dT:"Me comprometo a…",
 d:["Respetar a mis papás, profesores y compañeros.","Cumplir mis tareas y responder por mis notas.","Seguir las reglas de la casa y del colegio.","Usar el celular con responsabilidad.","Decir la verdad, aunque cueste.","Ayudar en la casa y cuidar mis cosas."],
 k5:"Ejemplos reales", h5:"¿Qué hacer cuando…?",
 i5:"Toca cada tarjeta para ver la diferencia entre la reacción de siempre y la respuesta de crianza positiva.",
 tap:"Toca para ver",
 scen:[
  ["Trae una mala nota","Gritar, comparar con otros, quitarle todo y decirle «usted no sirve para nada».","Respirar. Preguntar qué pasó, qué le costó. Hacer un plan juntos: horario de estudio y revisar avances cada semana.","photo-1758525860435-502240649c59"],
  ["No suelta el celular","Arrebatarle el celular delante de todos o romperlo.","Acordar horarios sin pantalla (comidas, después de las 9 p. m.). Los papás también cumplen la regla.","photo-1629360046014-c8c91b6c2881"],
  ["Llega tarde sin avisar","Pegarle o insultarlo apenas entra.","Decirle que se preocuparon, escuchar su explicación y acordar una consecuencia justa: la próxima salida será más corta.","photo-1557176278-3326a3193580"],
  ["Contesta mal","Contestar más duro, humillarlo o burlarse.","Poner el límite con calma: «Así no me hablas. Hablemos cuando estemos tranquilos». Y luego sí hablar.","photo-1792587716357-32a29eca7629"],
  ["Pelea con un compañero","Decirle «si le pegan, pegue más duro».","Escuchar su versión, enseñarle a buscar al director de grupo o a orientación, y hablar con el colegio si hace falta.","photo-1531984929664-2fb2be468d3e"],
  ["No hace sus oficios","Amenazarlo o castigarlo sin explicar.","Hacer una lista de tareas de la casa con tiempos claros. Reconocer cuando cumple.","photo-1475609471617-0ef53b59cff5"]
 ],

  ["¿Qué prohíbe la Ley 2089 de 2021?",["El uso del celular en el colegio","El castigo físico y los tratos crueles o humillantes","Que los niños trabajen en vacaciones"],1,"La Ley 2089 de 2021 prohíbe el castigo físico y los tratos crueles, humillantes o degradantes como forma de corrección."],
  ["Crianza positiva significa…",["Dejar que el hijo haga lo que quiera","Educar con afecto y con límites claros, sin violencia","Castigar más fuerte para que aprenda"],1,"Es amor y límites a la vez. No es permisividad ni castigo."],
  ["¿Un insulto o una burla es maltrato?",["No, solo los golpes cuentan","Sí, es un trato humillante","Solo si lo dice un profesor"],1,"La ley también protege la integridad psicológica y emocional."],
  ["Según la ley, los adolescentes…",["Solo tienen derechos","Tienen derechos y también responsabilidades","No tienen opinión"],1,"El artículo 15 dice que ejercer los derechos implica cumplir responsabilidades."],
  ["Si Isaac rompe una regla, lo mejor es…",["Una consecuencia justa y relacionada con lo que pasó","Un golpe para que no se repita","Ignorarlo"],0,"Las consecuencias deben ser lógicas, proporcionadas y explicadas."],
  ["¿Qué artículo agregó el «derecho al buen trato»?",["Art. 18-A de la Ley 1098","Art. 100 de la Constitución","Art. 5 de la Ley 1620"],0,"La Ley 2089 de 2021 agregó el artículo 18-A al Código de la Infancia."],
  ["¿Cuál es la línea gratuita del ICBF?",["123","141","018000"],1,"La Línea 141 del ICBF es gratuita y funciona las 24 horas."]

 i1:"The school invites mothers, fathers and guardians to a meeting with two topics. This app helps you arrive prepared and keep practicing at home afterwards.",

 topicsT:"Topics",
 topics:["Academic and behavior follow-up of the group.","Positive parenting workshop, under the Childhood and Adolescence Law."],
 meetNote:"Your attendance is very important.",
 k2:"What it is", h2:"The 5 pillars of positive parenting",
 i2:"Positive parenting is not letting kids do whatever they want. It means raising them with affection and clear rules, without hitting, yelling or humiliating. The goal is for kids to understand why something is right or wrong, not to obey only out of fear.",
 pillars:[
  ["Visible affection","Say and show that we love him, even when he makes mistakes. Love is not earned with grades: it is always given.","Try today: a hug and an \"I'm proud of you\" for something small.","photo-1531984929664-2fb2be468d3e"],
  ["Really listen","Ask how his day went, look him in the eye and put the phone away. Listen before correcting.","Try today: 10 minutes of screen-free talk at dinner.","photo-1629360046014-c8c91b6c2881"],
  ["Clear, respectful limits","Rules are explained, agreed on and kept. If broken, there is a fair consequence, not a punishment that hurts.","Try today: write three house rules together.","photo-1758525860435-502240649c59"],
  ["Lead by example","Kids copy what they see. If we want respect, calm and responsibility, we must show them first.","Try today: if you make a mistake, apologize in front of him.","photo-1557176278-3326a3193580"],
  ["Autonomy and responsibility","At 13 or 14 he can make small decisions and own them: homework, schedules, his room.","Try today: let him plan his own study schedule.","photo-1792587716357-32a29eca7629"]
 ],
 k3:"The law", h3:"What Colombian law says",
 i3:"The workshop is held \"under the Childhood and Adolescence Law\". Here are the key articles, with a simple explanation for Isaac. Tap each one to open it.",
 tabs:["Law 1098 of 2006","Law 2089 of 2021","Law 1620 of 2013"],
 laws:[
  [
   ["Art. 14","Parental responsibility","Parents must guide, care for, accompany and raise their children. The law says this responsibility can never involve physical or psychological violence.","Your parents must guide you, and the law tells them to do it without violence."],
   ["Art. 15","Rights come with responsibilities","Children and teens also have responsibilities according to their age. Exercising rights means fulfilling duties at home, at school and in society.","Having rights isn't just asking: you also have to do your part."],
   ["Art. 18","Right to personal integrity","Children and adolescents have the right to be protected from mistreatment and abuse of any kind, by parents, caregivers, relatives or anyone else.","Nobody can mistreat you, at home, at school or on the street."],
   ["Art. 18-A","Right to good treatment","Added by Law 2089 of 2021. Children and teens have the right to guidance, education, care and discipline through non-violent methods, protecting their physical, mental and emotional integrity.","You can be corrected, of course, but by talking, setting limits and fair consequences, never by hitting or humiliation."],
   ["Art. 39","Family obligations","The family must promote equal rights, affection, solidarity and mutual respect among its members, and ensure the children's education, health, development and values.","At home everyone owes respect: parents to kids and kids to parents."],
   ["Art. 42 & 43","School obligations","Schools must guarantee respectful and dignified treatment, teach respect and coexistence, and protect students against any form of mistreatment, physical or psychological aggression and humiliation.","The school must also protect you and teach how to get along. That's why it holds this workshop."]
  ],
  [
   ["Art. 1","Bans physical punishment","Colombia bans physical punishment and cruel, humiliating or degrading treatment as a method of correcting children and adolescents.","It is no longer legal to hit a child to \"discipline\" them."],
   ["Art. 2","What counts as physical punishment and humiliation","Physical punishment is using force to cause pain as correction. Cruel or humiliating treatment is anything that belittles, degrades, ridicules or threatens a child's dignity: insults, mockery, threats.","Not only hitting hurts: yelling, insults and mockery hurt too."],
   ["Art. 5","National Teaching Strategy","ICBF leads a strategy to teach families non-violent ways to educate, guide and discipline. Municipalities must adopt it and schools take part.","Workshops like Friday's come from this law."]
  ],
  [
   ["Law 1620","National School Coexistence System","Creates the school coexistence system, school coexistence committees and the Comprehensive Care Route for bullying, violence or conflicts between students.","If there is bullying or conflict, the school has a route to handle it."],
   ["Participation","The family is part of it","The law asks families to support their children's education, know the school's coexistence manual and attend school meetings and workshops.","That's why it matters that your dad or mom attends the meeting."]
  ]
 ],
 lawIsaac:"For Isaac:",
 src:"Sources: Law 1098 of 2006 (Childhood and Adolescence Code), Law 2089 of 2021 and Law 1620 of 2013, from <a href='https://www.icbf.gov.co/cargues/avance/compilacion/docs/ley_2089_2021.htm' target='_blank' rel='noopener'>ICBF</a> and <a href='https://www.suin-juriscol.gov.co' target='_blank' rel='noopener'>SUIN-Juriscol</a>. Texts are summarized in plain words; see the sources for the official text.",
 k4:"For Isaac", h4:"Your rights and your duties",
 i4:"Rights and duties go together. This is what you should receive and what you should give.",
 rT:"I have the right to…",
 r:["Be treated with respect, without hitting, yelling or humiliation.","Be listened to and have my opinion considered.","Study and be supported at school.","Make mistakes and learn from them.","Be protected from any mistreatment or abuse.","Rest, play and have friends."],
 dT:"I commit to…",
 d:["Respect my parents, teachers and classmates.","Do my homework and own my grades.","Follow the rules at home and at school.","Use my phone responsibly.","Tell the truth, even when it's hard.","Help at home and take care of my things."],
 k5:"Real examples", h5:"What to do when…?",
 i5:"Tap each card to see the difference between the usual reaction and the positive parenting response.",
 tap:"Tap to see",
 scen:[
  ["He brings a bad grade","Yelling, comparing him to others, taking everything away and saying \"you're useless\".","Breathe. Ask what happened and what was hard. Make a plan together: study schedule and weekly check-ins.","photo-1758525860435-502240649c59"],
  ["He won't put the phone down","Snatching the phone in front of everyone or breaking it.","Agree on screen-free times (meals, after 9 p.m.). Parents follow the rule too.","photo-1629360046014-c8c91b6c2881"],
  ["He comes home late without calling","Hitting or insulting him the moment he walks in.","Tell him you were worried, hear his explanation and agree on a fair consequence: the next outing will be shorter.","photo-1557176278-3326a3193580"],
  ["He talks back","Answering harsher, humiliating or mocking him.","Set the limit calmly: \"You don't talk to me like that. Let's talk when we're calm.\" Then do talk.","photo-1792587716357-32a29eca7629"],
  ["He fights with a classmate","Telling him \"if they hit you, hit back harder\".","Hear his side, teach him to go to his homeroom teacher or counselor, and talk to the school if needed.","photo-1531984929664-2fb2be468d3e"],
  ["He skips his chores","Threatening or punishing without explaining.","Make a list of house chores with clear times. Praise him when he does them.","photo-1475609471617-0ef53b59cff5"]
 ],

  ["What does Law 2089 of 2021 ban?",["Phones at school","Physical punishment and cruel or humiliating treatment","Kids working during vacation"],1,"Law 2089 of 2021 bans physical punishment and cruel, humiliating or degrading treatment as correction."],
  ["Positive parenting means…",["Letting kids do whatever they want","Raising them with affection and clear limits, without violence","Punishing harder so they learn"],1,"It's love and limits together. Not permissiveness, not punishment."],
  ["Is an insult or mockery mistreatment?",["No, only hitting counts","Yes, it's humiliating treatment","Only if a teacher says it"],1,"The law also protects psychological and emotional integrity."],
  ["According to the law, teenagers…",["Only have rights","Have rights and responsibilities","Have no opinion"],1,"Article 15 says exercising rights means fulfilling responsibilities."],
  ["If Isaac breaks a rule, the best response is…",["A fair consequence related to what happened","Hitting him so it doesn't happen again","Ignoring it"],0,"Consequences should be logical, proportionate and explained."],
  ["Which article added the \"right to good treatment\"?",["Art. 18-A of Law 1098","Art. 100 of the Constitution","Art. 5 of Law 1620"],0,"Law 2089 of 2021 added article 18-A to the Childhood Code."],

 foot1:"Family study app about the Grade 8A positive parenting workshop.",
 foot2:"Educational information based on Colombian law. It does not replace advice from a lawyer, ICBF or the Family Commissioner.",
 foot3:"Made with care by",
 clock:"Colombia time: ",
 saved:"Pact saved on this phone",
 today:[
  "Ask Isaac what the best and hardest parts of his day were, and just listen.",
  "Today, instead of scolding, try an agreement: what can we do differently?",
  "Name something good the other person did today. Say it out loud.",
  "Have dinner without phones, everyone, parents too.",
  "Before correcting, take three breaths. Calm also teaches.",
  "Write a new house rule together, with its fair consequence.",
  "Ask Isaac: what would you like to change at home?"
 ]
}};

let L = "es";
try{ L = localStorage.getItem("cp8a-lang") || "es"; }catch(e){}
let lawTab = 0, qi = 0, qs = 0, todayI = 0;
const $ = s => document.querySelector(s);
const esc = s => s;

function bogotaNow(){ return new Date(); }
function bogotaParts(d){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Bogota",year:"numeric",month:"2-digit",day:"2-digit"});
  return f.format(d);
}

function render(){
  const t = T[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el=>{ const k = el.dataset.t; if(t[k]!==undefined) el.innerHTML = t[k]; });
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on", b.dataset.lang===L));
  $("#nav").innerHTML = t.nav.map(([id,n])=>`<a href="#${id}">${n}</a>`).join("");

  $("#meetInfo").innerHTML = t.meet.map(([a,b])=>`<div class="row"><b>${a}</b><span>${b}</span></div>`).join("") +
    `<h3 style="margin:18px 0 6px;color:var(--navy2)">${t.topicsT}</h3>` +
    t.topics.map(x=>`<div class="topic">${x}</div>`).join("") +
    `<p style="margin-top:14px;font-weight:800;color:var(--coral)">${t.meetNote}</p>`;

  $("#pillars").innerHTML = t.pillars.map((p,i)=>`
    <div class="pcard reveal"><div class="img" style="background-image:url('${U(p[3])}')"><div class="num">${i+1}</div></div>
    <div class="tx"><h3>${p[0]}</h3><p>${p[1]}</p><div class="try">${p[2]}</div></div></div>`).join("");

  $("#tabs").innerHTML = t.tabs.map((x,i)=>`<button class="tab ${i===lawTab?'on':''}" data-i="${i}">${x}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{lawTab=+b.dataset.i;render();});
  $("#laws").innerHTML = t.laws[lawTab].map((a,i)=>`
    <details class="art" ${i===0?'open':''}><summary><span class="n">${a[0]}</span>${a[1]}<span class="plus">+</span></summary>
    <div class="body"><p>${a[2]}</p><div class="isaac"><b>${t.lawIsaac}</b> ${a[3]}</div></div></details>`).join("");

  $("#colR").innerHTML = `<h3>${t.rT}</h3><ul>${t.r.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  $("#colD").innerHTML = `<h3>${t.dT}</h3><ul>${t.d.map(x=>`<li>${x}</li>`).join("")}</ul>`;

  $("#scen").innerHTML = t.scen.map(s=>`
    <div class="flip reveal"><div class="in">
      <div class="face f" style="background-image:url('${U(s[3])}')"><h3>${s[0]}</h3><small>${t.tap}</small></div>
      <div class="face b"><h3 style="color:var(--navy2);font-size:1.15rem">${s[0]}</h3>
        <div class="no"><b>${t.no}</b>${s[1]}</div><div class="yes"><b>${t.yes}</b>${s[2]}</div></div>
    </div></div>`).join("");
  $("#scen").querySelectorAll(".flip").forEach(f=>f.onclick=()=>f.classList.toggle("on"));

  $("#asks").innerHTML = t.asks.map(a=>`<div class="ask reveal"><b>${a[0]}</b><p>${a[1]}</p></div>`).join("");
  $("#lines").innerHTML = t.lines.map(l=>`<a class="line" href="${l[2]}"><span><strong>${l[0]}</strong><br><small style="color:#c9d6e6">${l[3]}</small></span><b>${l[1]}</b></a>`).join("");
  $("#note").placeholder = t.notePh;

  renderPact(); renderQuiz(); renderToday(); tick(); observe();
}

/* slideshow */
function slides(){
  const box = $("#slides");
  box.innerHTML = SLIDES.map((s,i)=>`<div class="${i===0?'on':''}" style="background-image:url('${U(s)}')"></div>`).join("");
  let i = 0;
  setInterval(()=>{ const d = box.children; d[i].classList.remove("on"); i=(i+1)%d.length; d[i].classList.add("on"); }, 5500);
}

/* countdown + clock */
function tick(){
  const t = T[L], now = new Date(), diff = MEETING - now;
  const sameDay = bogotaParts(now) === bogotaParts(MEETING);
  if(diff > 0){
    const d=Math.floor(diff/864e5), h=Math.floor(diff%864e5/36e5), m=Math.floor(diff%36e5/6e4), s=Math.floor(diff%6e4/1e3);
    $("#count").innerHTML = [d,h,m,s].map((v,i)=>`<div><b>${String(v).padStart(2,"0")}</b><small>${t.cd[i]}</small></div>`).join("");
    $("#countnote").textContent = sameDay ? t.cdNow : t.cdBefore;
  } else {
    $("#count").innerHTML = "";
    $("#countnote").textContent = sameDay ? t.cdNow : t.cdAfter;
  }
  $("#clock").textContent = t.clock + new Intl.DateTimeFormat(L==="es"?"es-CO":"en-US",{timeZone:"America/Bogota",dateStyle:"full",timeStyle:"short"}).format(now);
}
setInterval(tick,1000);

/* hoy: cambia cada día y en cada visita */
function renderToday(){
  const t = T[L];
  $("#todayTx").textContent = t.today[todayI % t.today.length];
}
function initToday(){
  const day = parseInt(bogotaParts(new Date()).replace(/-/g,""),10);
  let visits = 0; try{ visits = +(localStorage.getItem("cp8a-v")||0)+1; localStorage.setItem("cp8a-v",visits);}catch(e){}
  todayI = (day + visits) % 7;
}

/* quiz */
function renderQuiz(){
  const t = T[L], q = t.quiz, box = $("#qbox");
  if(qi >= q.length){
    const msg = qs>=7?t.qEnd[0]:qs>=5?t.qEnd[1]:t.qEnd[2];
    box.innerHTML = `<div class="prog"><i style="width:100%"></i></div><div class="score">${qs}/${q.length}</div><p class="qq">${msg}</p><button class="btn main" id="qr">${t.qRestart}</button>`;
    $("#qr").onclick=()=>{qi=0;qs=0;renderQuiz();};
    return;
  }
  const [p,opts,ok,ex] = q[qi];
  box.innerHTML = `<div class="prog"><i style="width:${qi/q.length*100}%"></i></div>
    <div style="color:#c7d3e3;font-weight:700;margin-bottom:6px">${qi+1} ${t.qOf} ${q.length}</div>
    <div class="qq">${p}</div>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}
    <div class="expl" id="ex">${ex}</div>
    <div class="qnav"><span></span><button class="btn main" id="qn" style="display:none">${t.qNext}</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(box.dataset.done==="1") return; box.dataset.done="1";
    const i=+b.dataset.i;
    box.querySelectorAll(".opt")[ok].classList.add("ok");
    if(i!==ok) b.classList.add("bad"); else qs++;
    $("#ex").style.display="block"; $("#qn").style.display="inline-block";
  });
  box.dataset.done="0";
  $("#qn").onclick=()=>{qi++;renderQuiz();};
}

/* pacto */
function getPact(){ try{ return JSON.parse(localStorage.getItem("cp8a-pact")||"{}"); }catch(e){ return {}; } }
function setPact(p){ try{ localStorage.setItem("cp8a-pact",JSON.stringify(p)); }catch(e){} }
function renderPact(){
  const t = T[L], p = getPact();
  const grp = (title,arr,key)=>`<h3>${title}</h3>`+arr.map((x,i)=>`<label><input type="checkbox" data-k="${key}${i}" ${p[key+i]?'checked':''}><span>${x}</span></label>`).join("");
  $("#plist").innerHTML = grp(t.pIsaac,t.pI,"i") + grp(t.pPapas,t.pP,"p");
  $("#note").value = p.note || "";
  $("#plist").querySelectorAll("input").forEach(c=>c.onchange=()=>{ const q=getPact(); q[c.dataset.k]=c.checked; setPact(q); meter(); toast(t.saved); });
  meter();
}
function meter(){
  const t = T[L], p = getPact(), total = t.pI.length + t.pP.length;
  const n = Object.keys(p).filter(k=>k!=="note" && p[k]).length, pc = Math.round(n/total*100);
  $("#ring").style.background = `conic-gradient(var(--coral) ${pc*3.6}deg,#f0e8e0 0deg)`;
  $("#ringN").textContent = pc + "%";
  $("#meterMsg").textContent = t.meterMsg[pc===0?0:pc<50?1:pc<100?2:3];
}
$("#note").addEventListener("input",e=>{ const q=getPact(); q.note=e.target.value; setPact(q); });
$("#shareP").onclick = ()=>{
  const t = T[L], p = getPact();
  const lines = [t.shareHead, "", t.pIsaac+":"]
    .concat(t.pI.filter((_,i)=>p["i"+i]).map(x=>"- "+x)).concat(["", t.pPapas+":"])
    .concat(t.pP.filter((_,i)=>p["p"+i]).map(x=>"- "+x));
  if(p.note) lines.push("", p.note);
  lines.push("", location.origin + location.pathname);
  window.open("https://wa.me/?text="+encodeURIComponent(lines.join("\n")),"_blank");
};

function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1600); }

/* animaciones al hacer scroll */
let io;
function observe(){
  if(!io) io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("show"); io.unobserve(e.target);} }),{threshold:.15});
  document.querySelectorAll(".reveal:not(.show),.dcol:not(.show)").forEach(el=>io.observe(el));
}
const sections = [...document.querySelectorAll("section[id]")];
window.addEventListener("scroll",()=>{
  const y = scrollY + 120; let cur = "";
  sections.forEach(s=>{ if(s.offsetTop<=y) cur=s.id; });
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+cur));
},{passive:true});

document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ L=b.dataset.lang; try{localStorage.setItem("cp8a-lang",L);}catch(e){} render(); });
$("#todayBtn").onclick=()=>{ todayI++; renderToday(); };

initToday(); slides(); render();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
